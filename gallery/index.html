<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Iris' Art Gallery</title>
	<meta name="description" content="A very cool gallery.">
	<link rel="stylesheet" href="/common.css">
	<link rel="stylesheet" href="gallery.css">
	<link href="/lib/fontawesome/css/all.min.css" rel="stylesheet">
	<!-- <script src="/lib/jquery-3.7.1.min.js"></script> -->
	<!-- <script src="/lib/masonry.pkgd.min.js"></script> -->
	<script src="/lib/include-html.js"></script>
	<script src="/lib/imagesloaded.pkgd.min.js"></script>
	<meta id="vp" name="viewport">
	<link rel="icon" type="image/x-icon" href="/media/Rai/favicon.png">
	<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

	<meta content="Iris' fancy Gallery" property="og:title" />
	<meta content="A very cool gallery." property="og:description" />
	<meta content="https://raidev.eu" property="og:url" />
	<meta id="img-meta" content="/media/Stamps/stamp.png" property="og:image" />
	<meta content="#9948b1" data-react-helmet="true" name="theme-color" />
</head>

<body style="background-color: #4b4254;">

	<!-- <div include-html="/social-links.html" class="hide-mobile"></div> -->

	<nav id="header">
		<div id="header-cont">
			<a href="/" class="home-button" onclick="homeButton(); return false;">
				<img src="/media/Stamps/stamp.png" alt="Home button">
			</a>
			<h1>Art Gallery</h1>
		</div>
	</nav>

	<div style="display: flex; margin: 24px; align-items: center;">
		<button class=" tag-expand-button" onclick="tag_expand();"><i class="fa-solid fa-chevron-down"></i>
			Tags</a></button>
		<h1 class="gallery-tag-title">All artwork</h1>
	</div>

	<div id="tag-container">
		<!-- &emsp; &emsp; &emsp; -->
		<button onclick="window.location.href='/gallery/#'" class="tag-button"><img class='tag-icon'>Finished
			Work</button>
	</div>

	<h2 class="gallery-loader">Loading images... <br><br>This might take a bit.</h2>

	<div class="gallery-container masonry">
	</div>
</body>

</html>
<script>
	function tag_expand() {
		const container = document.getElementById("tag-container");
		const gallery = document.getElementsByClassName("gallery-container")[0];
		const button = document.getElementsByClassName("tag-expand-button")[0].children[0];
		if (container.style.whiteSpace != "unset") {
			container.style.whiteSpace = "unset";
			gallery.setAttribute('style', 'opacity:10% !important; pointer-events: none;');
			button.classList.remove("fa-chevron-down");
			button.classList.add("fa-chevron-up");
		} else tag_unexpand();
	}

	function tag_unexpand() {
		const container = document.getElementById("tag-container");
		const gallery = document.getElementsByClassName("gallery-container")[0];
		const button = document.getElementsByClassName("tag-expand-button")[0].children[0];
		container.style.whiteSpace = "nowrap";
		gallery.setAttribute('style', '');
		button.classList.remove("fa-chevron-up");
		button.classList.add("fa-chevron-down");
	}
</script>
<script type="text/javascript" src="/lib/handle-slinks.js"></script>
<script type="text/javascript" src="/lib/gallery-fetch.js"></script>
<script type="text/javascript" src="/lib/image-popup.js"></script>
<script>
	function setWidth() {
		const mvp = document.getElementById('vp');
		if (window.innerWidth < 500) {
			mvp.setAttribute('content', 'width=500px');
			console.log("mobile mode");
		} else {
			mvp.setAttribute('content', 'width=device-width');
			console.log("swakrop mode");
		}
	};

	window.addEventListener("load", setWidth());
</script>
<script>
	function homeButton() {
		document.body.classList.add("page-dismiss");

		setTimeout(function () {
			window.location.href = '/';
		}, 200);
	}
</script>
